<div class="dex-list" #listContainer>
  @for (pokemon of completeList; track pokemon.id) {
    <div
      class="dex-list-row"
      [class.dex-list-row--selected]="selectedPokemon?.id === pokemon.id"
      (click)="updatePokemon(pokemon)"
    >
      <span class="dex-list-ball"></span>
      <span class="dex-list-id">#{{ pokemon.id | number:'3.0-0' }}</span>
      <span class="dex-list-name">{{ pokemon.name | titlecase }}</span>
    </div>
  }
</div>
