<div class="card-container">
  <mat-card class="card-style">
    <mat-expansion-panel *ngFor="let generation of pokemonService.generations">
      <mat-expansion-panel-header>
        <mat-panel-title>
          {{ generation.name }}
        </mat-panel-title>
      </mat-expansion-panel-header>

      <div class="pokemon-card-grid">
        <mat-grid-list cols="6" rowHeight="1:1" gutterSize="16px">
          <mat-grid-tile *ngFor="let pokemon of getPokemonForGeneration(generation)">
            <mat-card class="pokemon-card" (click)="updatePokemon(pokemon); openDialog()">
              <div class="pokemon-image-container">
                <img
                  [src]="pokemon.sprites?.front_default || pokemon.sprites?.other?.['official-artwork']?.front_default"
                  alt="{{ pokemon.name }}" class="pokemon-image" />
              </div>
              <div class="pokemon-name">
                {{ pokemon.name | titlecase }}
              </div>
            </mat-card>
          </mat-grid-tile>
        </mat-grid-list>
      </div>
    </mat-expansion-panel>
  </mat-card>
</div>
