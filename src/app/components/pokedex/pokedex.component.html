<mat-divider></mat-divider>
<div>
    <mat-grid-list cols="3" rowHeight="100%">
        <mat-grid-tile class="pokedexSection nonBootyDivider">
            <mat-list role="list">
                <mat-list-item *ngFor="let pokedex of pokedexList.results"><button
                        mat-button (click)="getSpecificPokedex(pokedex.name);">{{pokedex.name}}</button></mat-list-item>
            </mat-list>
        </mat-grid-tile>
        <mat-grid-tile class="pokemonListSection nonBootyDivider">
            <mat-list role="list">
                <mat-list-item *ngFor="let pokemon of pokemonList">{{pokemon.name}}</mat-list-item>
            </mat-list>
        </mat-grid-tile>
        <mat-grid-tile class="pokemonListSection nonBootyDivider">
            <mat-list role="list">
                <mat-list-item *ngFor="let pokedex of pokemonList">{{pokedex.name}}</mat-list-item>
            </mat-list>
        </mat-grid-tile>
    </mat-grid-list>
</div>
