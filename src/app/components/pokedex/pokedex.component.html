<div class="pokedex-toolbar">
  <button
    mat-raised-button
    color="primary"
    (click)="toggleContentExpanded()"
    [attr.aria-expanded]="isContentExpanded"
    aria-label="{{ isContentExpanded ? 'Collapse' : 'Expand' }} content"
  >
    {{ isContentExpanded ? 'Collapse' : 'Expand' }} content
  </button>
</div>

<div
  class="pokedex-book-content"
  [class.collapsed]="!isContentExpanded"
  role="region"
  [attr.aria-hidden]="!isContentExpanded"
>
  <div
    animate.enter="collapse"
    animate.leave="expand"
    class="selected-pokemon-header"
  >
    @if (selectedPokemon) {
    <div class="selected-pokemon-display">
      <div class="selected-pokemon-image">
        <img
          [src]="selectedPokemon.sprites.front_default"
          [alt]="selectedPokemon.name"
        />
      </div>
      <div class="selected-pokemon-info">
        <div class="selected-pokemon-id">#{{ selectedPokemon.id }}</div>
        <div class="selected-pokemon-name">
          {{ selectedPokemon.name | titlecase }}
        </div>
        <div class="selected-pokemon-types">
          @for (type of selectedPokemon.types; track type) {
          <span class="type-badge" [class]="'type-' + type.type.name">
            {{ type.type.name | titlecase }}
          </span>
          }
          <div type="number">
            {{ (selectedPokemon.weight / 4.536).toFixed(2) }} lbs
          </div>
        </div>
      </div>
    </div>
    }
  </div>
  <div
    class="card-scroll-container"
    #scrollContainer
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp()"
    (mouseleave)="onMouseUp()"
    [class.grabbing]="isDragging"
  >
    @for (pokemon of completeList; track pokemon) {
    <mat-card class="card" [class.selected]="selectedPokemon?.id === pokemon.id">
      <mat-card-content
        style="display: flex; justify-content: center; align-items: center"
      >
        <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name" />
      </mat-card-content>
    </mat-card>
    }
  </div>
</div>
