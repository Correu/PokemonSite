<div class="card-container">
  <mat-card class="card-style">
    <mat-grid-list cols="3" rowHeight="100%">
      <mat-grid-tile>
        <mat-list role="list">
          <p *ngFor="let generation of pokemonService.generations">
            {{ generation.name }} - {{ generation.quantity }}
          </p>
        </mat-list>
      </mat-grid-tile>
      <mat-grid-tile>
        <mat-card class="pokemon-box">
          <app-pokemon [selectedPokemon]="selectedPokemon"></app-pokemon>
        </mat-card>
      </mat-grid-tile>
      <mat-grid-tile class="pokemon-list">
        <p class="header-style">Pokemon Selection</p>
        <form [formGroup]="pokeForm" (ngSubmit)="
            updateDetailsByName(pokeForm.get('searchedPokemon')?.value)
          ">
          <mat-form-field>
            <mat-label>Search For Pokemon</mat-label>
            <input matInput formControlName="searchedPokemon" name="searchedPokemon" (keydown.enter)="
                updateDetailsByName(pokeForm.get('searchedPokemon')?.value)
              " />
          </mat-form-field>
        </form>
        <mat-list role="list">
          <mat-list-item *ngFor="let pokemon of filteredList"><button mat-button
              (mouseover)="updateDetailsById(pokemon.id)">
              {{ pokemon.name }}
            </button></mat-list-item>
        </mat-list>
      </mat-grid-tile>
    </mat-grid-list>
  </mat-card>
</div>
