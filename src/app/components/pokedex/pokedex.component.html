<div layout="row">
    <mat-grid-list cols="3" rowHeight="100%" class="pokedexSection">
        <mat-grid-tile>
            <mat-list role="list">
                <mat-list-item *ngFor="let pokedex of pokedexList.results"><button
                        mat-button>{{pokedex.name}}</button></mat-list-item>
            </mat-list>
        </mat-grid-tile>
        <mat-grid-tile class="pokemonListSection">
            <mat-list role="list">
                <mat-list-item *ngFor="let pokemon of pokemonList">{{pokemon.name}}</mat-list-item>
            </mat-list>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-list role="list">
                <mat-list-item *ngFor="let pokedex of pokedexList.results">{{pokedex.name}}</mat-list-item>
            </mat-list>
        </mat-grid-tile>
    </mat-grid-list>
</div>
<p>{{selectedPokedex}}</p>
