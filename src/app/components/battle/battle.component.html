<div>
    <h1 style="text-align: center;">Pokemon Battle</h1>
</div>
<p>PLAYER TEAM</p>
<mat-icon *ngFor="let pokeball of playerTeam" fontIcon="circle"></mat-icon>
<mat-grid-list cols="2" rowHeight="2:1">
    <mat-grid-tile *ngFor="let poke of playerTeam">
        <mat-card>
            <mat-card-header>
                <mat-card-title>{{poke.name}}</mat-card-title>
            </mat-card-header>
            <mat-icon class="circle-outline" fontIcon="circle"></mat-icon>
            <img src="{{poke.sprites.front_default}}" width="75px" height="75px">
            <mat-card-content>
                <h1 *ngFor="let stat of poke.stats">{{stat.stat.name}} {{stat.base_stat}}</h1>
            </mat-card-content>
        </mat-card>
    </mat-grid-tile>
</mat-grid-list>
<p>ENEMY TEAM</p>
<mat-icon *ngFor="let pokeball of enemyTeam" fontIcon="circle"></mat-icon>
<mat-grid-list cols="2" rowHeight="2:1">
    <mat-grid-tile *ngFor="let poke of enemyTeam">
        <mat-card>
            <mat-card-header>
                <mat-card-title>{{poke.name}}</mat-card-title>
            </mat-card-header>
            <img src="{{poke.sprites.front_default}}" width="75px" height="75px">
            <mat-card-content>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/master-ball.png">
                <h1 *ngFor="let stat of poke.stats">{{stat.stat.name}} {{stat.base_stat}}</h1>
            </mat-card-content>
        </mat-card>
    </mat-grid-tile>
</mat-grid-list>
