<div class="battle-container">
  <!-- Enemy Pokémon (Top Right) -->
  <div class="enemy-container">
    <mat-card class="enemy-card">
      <div class="pokemon-details">
        <span class="pokemon-name">Pidgey</span>
        <span class="level">Lv. 17</span>
      </div>
      <mat-progress-bar mode="determinate" [value]="30"></mat-progress-bar>
    </mat-card>
    <img
      class="enemy-sprite"
      src="assets/images/pokeball_background.jpg"
      alt="Enemy Pokémon"
    />
  </div>

  <!-- Player Pokémon (Bottom Left) -->
  <div class="player-container">
    <img
      class="player-sprite"
      src="assets/images/alola.webp"
      alt="Player Pokémon"
    />
    <mat-card class="player-card">
      <div class="pokemon-details">
        <span class="pokemon-name">Pikachu</span>
        <span class="level">Lv. 42</span>
      </div>
      <mat-progress-bar mode="determinate" [value]="100"></mat-progress-bar>
    </mat-card>
  </div>

  <!-- Battle Action Box (Bottom) -->
  <div class="battle-actions">
    <mat-card>
      <div class="action-text">What will Pikachu do?</div>
      <div class="buttons">
        <button mat-button color="warn">FIGHT</button>
        <button mat-button color="primary">BAG</button>
        <button mat-button color="accent">POKÉMON</button>
        <button mat-button color="primary">RUN</button>
      </div>
    </mat-card>
  </div>
</div>
