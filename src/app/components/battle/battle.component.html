<div class="battle-container battle-container--placeholder">
  <div class="battle-placeholder">
    <mat-icon class="battle-placeholder-icon" aria-hidden="true"
      >construction</mat-icon
    >
    <h1 class="battle-placeholder-title">Battle</h1>
    <p class="battle-placeholder-lead">Under development</p>
    <p class="battle-placeholder-text">
      Multiplayer battles and room setup are not available yet. Check back in a
      future update.
    </p>
    <p class="battle-placeholder-hint">
      Use the <strong>List</strong> tab on the Pokédex to browse Pokémon.
    </p>
    <a mat-stroked-button color="primary" routerLink="/" class="battle-back-link">
      <mat-icon>arrow_back</mat-icon>
      Back to List
    </a>
  </div>
</div>
