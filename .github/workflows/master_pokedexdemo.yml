name: Angular App CI/CD

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: |
    npm install -g @angular/cli
    npm ci
  displayName: 'Install Angular CLI and dependencies'

- script: |
    npm run build -- --configuration=production
  displayName: 'Build Angular App'

- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)/dist/pokemon-site'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
  displayName: 'Copy built files to staging directory'

- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'angular-app'
  displayName: 'Publish Artifact'

- task: AzureWebApp@1
  inputs:
    azureSubscription: '<AzureSubscription>'
    appName: '<YourWebAppName>'
    package: '$(Build.ArtifactStagingDirectory)/angular-app'
    deploymentMethod: 'zipDeploy'
    enableCustomDeployment: true
  displayName: 'Deploy to Azure Web App'